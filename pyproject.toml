[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-builds"
dynamic = ["version"]
description = "Buildr: shared build queue and terminal UI for Ghostty and Herdr"
requires-python = ">=3.8"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/stateset/agent-builds"
Issues = "https://github.com/stateset/agent-builds/issues"
Changelog = "https://github.com/stateset/agent-builds/blob/main/CHANGELOG.md"

[project.scripts]
buildr = "agent_builds.__main__:main"
agent-builds = "agent_builds.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_builds*"]

[tool.setuptools.dynamic]
version = {attr = "agent_builds.__version__"}
