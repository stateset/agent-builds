name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12']
    env:
      AGENT_BUILDS_STATE: ${{ github.workspace }}/.agent-builds-output/ci-${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Configure this isolated CI queue
        run: >-
          python -m agent_builds config
          --set cpu_slots=2 --set max_running=1 --set max_heavy=1
          --set memory_gb=2 --set quick_jobs=2 --set heavy_jobs=2
          --set quick_reserve_slots=0 --set quick_reserve_jobs=0
          --set quick_reserve_memory_gb=0 --set min_free_gb=1
          --set min_available_gb=0 --set nice=0
      - name: Independent regression exit status
        run: python -m unittest discover -s tests -v
      - name: Install static check tools
        if: matrix.python == '3.12'
        run: python -m pip install 'ruff==0.17.1' 'mypy==2.4.0'
      - name: Focused correctness lint
        if: matrix.python == '3.12'
        run: >-
          python -m agent_builds run --lane quick --jobs 1 --memory-gb 1
          --timeout 120 -- python -m ruff check --select E9,F63,F7,F82
          agent_builds tests tools
      - name: Format and type checks for new coordination modules
        if: matrix.python == '3.12'
        run: |
          python -m agent_builds run --lane quick --jobs 1 --memory-gb 1 --timeout 120 -- python -m ruff format --check agent_builds/execution_policy.py agent_builds/polling.py agent_builds/launch.py agent_builds/scale.py agent_builds/queue_health.py tests/test_coordination.py tests/test_scale.py tests/test_queue_health.py tests/test_admission_reads.py tests/test_lock_scaling.py tests/test_recovery_check.py tests/test_usage_contention.py agent_builds/tui_browser.py agent_builds/tui_logs.py agent_builds/tui_details.py agent_builds/tui_history.py agent_builds/tui_reads.py agent_builds/tui_text.py agent_builds/tui_inspect.py tests/test_tui_inspect.py agent_builds/tui_views.py tests/test_tui_views.py agent_builds/cli_parsing.py tests/test_tui_history.py tests/test_cli_parsing.py agent_builds/output.py agent_builds/tui_prompt.py agent_builds/process_tree.py tests/test_process_tree.py tools/verify_telemetry_scan.py agent_builds/verification.py agent_builds/engine_study.py tests/test_engine_study.py tools/verify_runner_cost.py agent_builds/experiments.py tests/test_verification_workload.py tests/test_output.py tests/test_tui_prompt.py tests/test_tui_browser.py tests/test_tui_logs.py tests/test_tui_details.py tools/verify_admission_reads.py tools/verify_coordination.py tools/verify_installed.py tools/verify_recovery.py tools/verify_tui_cache.py
          python -m agent_builds run --lane quick --jobs 1 --memory-gb 1 --timeout 120 -- python -m mypy --follow-imports=skip --check-untyped-defs agent_builds/execution_policy.py agent_builds/polling.py agent_builds/launch.py
      - name: Verify bounded admission reads with bulky evidence
        if: matrix.python == '3.12'
        run: |
          git worktree add --detach "$RUNNER_TEMP/buildr-admission-baseline" v0.24.0
          python -m agent_builds run --lane quick --jobs 1 --memory-gb 2 --timeout 180 -- python tools/verify_admission_reads.py --baseline-checkout "$RUNNER_TEMP/buildr-admission-baseline" --output "$RUNNER_TEMP/admission-reads.json"
      - name: Retain admission comparison evidence
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admission-reads
          path: ${{ runner.temp }}/admission-reads.json
          if-no-files-found: warn
          retention-days: 14
      - name: Compare telemetry measurements with the released sampler
        if: matrix.python == '3.12'
        run: >-
          python -m agent_builds run --lane quick --jobs 1 --memory-gb 2 --timeout 120 --
          python tools/verify_telemetry_scan.py --output '${{ runner.temp }}/telemetry-scan.json'
      - name: Independently verify telemetry evidence
        if: matrix.python == '3.12'
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'telemetry-scan.json').read_text())
          assert report['result']=='passed' and report['source_changed'] is False
          assert len(report['records'])==24
          assert {(r['depth'],r['pair'],r['mode']) for r in report['records']}=={(d,p,m) for d in (1,4,32) for p in range(4) for m in ('baseline','candidate')}
          for record in report['records']:
              assert record['measurements_match'] and record['samples']==10
              assert record['processes']==1000 and record['selected_identities']==34
          PYTHON
      - name: Retain telemetry comparison evidence
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telemetry-scan
          path: ${{ runner.temp }}/telemetry-scan.json*
          if-no-files-found: warn
          retention-days: 14
      - name: Regression tests through Buildr
        run: >-
          python -m agent_builds run --lane quick --jobs 2 --memory-gb 2
          --timeout 600 -- python -m unittest discover -s tests -v
      - name: Compare dashboard cache work with the released TUI
        if: matrix.python == '3.12'
        run: >-
          python -m agent_builds run --lane quick --jobs 1 --memory-gb 2 --timeout 120 --
          python tools/verify_tui_cache.py --output '${{ runner.temp }}/tui-cache.json'
      - name: Independently verify dashboard cache evidence
        if: matrix.python == '3.12'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP'])/'tui-cache.json').read_text())
          assert report['result']=='passed' and report['source_changed'] is False
          assert len(report['records'])==8
          assert {(r['pair'],r['mode'],r['changing']) for r in report['records']} == {
              (pair,mode,changing) for pair in (0,1)
              for mode in ('baseline','candidate') for changing in (False,True)}
          for record in report['records']:
              assert record['frames']==300 and record['rows']==200 and record['final_output_matches']
              assert record['filter_calls']==record['sort_calls']==(300 if record['mode']=='baseline' else 60)
              if record['mode']=='baseline':
                  assert record['read_calls']==300 and record['read_bytes']==300*65536
              else:
                  assert record['read_calls']<=60 and record['read_bytes']<=60*65536
          PY
      - name: Retain dashboard cache comparison
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-cache
          path: ${{ runner.temp }}/tui-cache.json
          if-no-files-found: warn
          retention-days: 14
      - name: Install the optional MCP test client
        if: matrix.python == '3.12'
        run: python -m pip install 'mcp==1.30.0'
      - name: Official MCP client through Buildr
        if: matrix.python == '3.12'
        run: >-
          python -m agent_builds run --lane quick --jobs 2 --memory-gb 1
          --timeout 120 -- python tools/verify_mcp_client.py
          --output '${{ runner.temp }}/official-mcp.json'
      - name: Install distribution test tools
        if: matrix.python == '3.12'
        run: python -m pip install build twine 'setuptools>=61' wheel
      - name: Build distributions through Buildr
        if: matrix.python == '3.12'
        run: >-
          python -m agent_builds run --lane quick --jobs 2 --memory-gb 1
          --timeout 120 -- python -m build
      - name: Validate distributions
        if: matrix.python == '3.12'
        run: python -m twine check dist/*
      - name: Verify native and batch execution from an installed wheel
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/buildr-wheel"
          "$RUNNER_TEMP/buildr-wheel/bin/python" -m pip install --no-deps dist/*.whl
          python -m agent_builds run --lane quick --jobs 2 --memory-gb 1 --timeout 120 -- python tools/verify_installed.py --python "$RUNNER_TEMP/buildr-wheel/bin/python"
      - name: Buildr package and test workload acceptance
        if: matrix.python == '3.12'
        run: >-
          python -m agent_builds run --lane quick --jobs 2 --memory-gb 2 --timeout 600 --
          python -m agent_builds experiment run --scenario buildr_verification
          --include-batches --pairs 1 --agents 2 --cpus 2
          --output '${{ runner.temp }}/verification-workload.json'
      - name: Independently check real workload evidence
        if: matrix.python == '3.12'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'verification-workload.json').read_text())
          assert report['verification_workload_valid'] and report['source_changed'] is False
          assert len(report['records'])==4
          assert {arm['mode'] for arm in report['records']}=={'independent','queued','serial_batch','parallel_batch'}
          for arm in report['records']:
              assert arm['verified_jobs']==arm['jobs']==2
              for job in arm['results']:
                  assert job['exit_code']==0 and job.get('wrapper_exit_code',0)==0
                  proof=job['verification']
                  assert [stage['name'] for stage in proof['stages']]==['package','browser_tests','prompt_tests']
                  assert all(stage['exit_code']==0 for stage in proof['stages'])
                  assert len(proof['artifacts'])==2
          PY
      - name: Retain real workload evidence
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-workload
          path: ${{ runner.temp }}/verification-workload.json*
          if-no-files-found: warn
          retention-days: 14
      - name: Before and after runner workload acceptance
        if: matrix.python == '3.12'
        run: >-
          python -m agent_builds run --lane quick --jobs 2 --memory-gb 2 --timeout 600 --
          python tools/verify_runner_cost.py --pairs 1 --agents 2 --cpus 2
          --output '${{ runner.temp }}/runner-cost.json'
      - name: Independently check runner comparison evidence
        if: matrix.python == '3.12'
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'runner-cost.json').read_text())
          assert report['result']=='passed' and report['verification_valid'] and report['source_changed'] is False
          assert report['baseline']['commit']=='c0aaabc0c7abed34d95988ba0c84cd8d9cf746ab'
          assert len(report['records'])==2 and {r['engine'] for r in report['records']}=={'baseline','candidate'}
          assert len(report['comparisons'])==1
          for arm in report['records']:
              assert arm['jobs']==arm['verified_jobs']==2 and arm['failed_jobs']==0
              assert arm['sampler_interval_seconds']==0.1 and arm['sampler_samples']>0
              assert {j['id'] for j in arm['results']}=={'agent-0','agent-1'}
              for job in arm['results']:
                  assert job['verified'] and job['exit_code']==0
                  proof=job['verification']
                  assert [s['name'] for s in proof['stages']]==['package','browser_tests','prompt_tests']
                  assert all(s['exit_code']==0 for s in proof['stages']) and len(proof['artifacts'])==2
          PYTHON
      - name: Retain runner comparison evidence
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-cost
          path: ${{ runner.temp }}/runner-cost.json*
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified release distributions
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      AGENT_BUILDS_STATE: ${{ github.workspace }}/.agent-builds-output/recovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Configure the isolated outer reservation
        run: >-
          python -m agent_builds config --set cpu_slots=2 --set memory_gb=2
          --set max_running=1 --set quick_reserve_slots=0 --set quick_reserve_jobs=0
          --set quick_reserve_memory_gb=0 --set min_free_gb=1
          --set min_available_gb=0 --set nice=0
      - name: Repeated native runner-loss and mixed-version recovery checks
        run: >-
          python -m agent_builds run --lane quick --jobs 2 --memory-gb 2 --timeout 240 --
          python tools/verify_recovery.py --cycles 3 --output '${{ runner.temp }}/recovery.json'
      - name: Independently verify the retained recovery evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP'])/'recovery.json').read_text())
          assert report['result']=='passed' and report['source_changed'] is False
          assert len(report['cases'])==12
          assert {(c['cycle'],c['arm'],c['cancelled']) for c in report['cases']} == {
              (cycle,arm,cancel) for cycle in range(3)
              for arm in ('candidate','v0.24.2') for cancel in (False,True)}
          for case in report['cases']:
              assert case['result']=='passed' and case['native_attempts']==1
              assert case['recoveries_while_child_live']==4
              assert case['secondary_lock_preserved'] and case['unrelated_work_completed']
              assert case['native_lock_overlap'] is False
              assert case['peak_reserved_slots']<=2 and case['peak_reserved_memory_gb']<=2
              assert case['outcome']==('cancelled' if case['cancelled'] else 'lost')
              if case['cancelled']:
                  assert case['exit_code'] in (None,130)
              else:
                  assert case['exit_code'] is None
          PY
      - name: Retain recovery evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery
          path: ${{ runner.temp }}/recovery.json*
          if-no-files-found: warn
          retention-days: 14
      - name: Retain failed fixture databases and process logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-failure-fixtures
          path: ${{ runner.temp }}/buildr-recovery-*/
          if-no-files-found: warn
          retention-days: 14

  process-scale:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        agents: [30, 100]
    env:
      AGENT_BUILDS_STATE: ${{ github.workspace }}/.agent-builds-output/scale-${{ matrix.agents }}
      BUILDR_SCALE_AGENTS: ${{ matrix.agents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Configure this isolated CI reservation
        run: >-
          python -m agent_builds config --set cpu_slots=2 --set memory_gb=4
          --set max_running=1 --set max_heavy=1 --set quick_jobs=2 --set heavy_jobs=2
          --set quick_reserve_slots=0 --set quick_reserve_jobs=0
          --set quick_reserve_memory_gb=0 --set min_free_gb=1
          --set min_available_gb=0 --set nice=0
      - name: Prepare the frozen baseline
        run: git worktree add --detach "$RUNNER_TEMP/buildr-baseline" v0.22.2
      - name: Real-process comparison through Buildr
        run: >-
          python -m agent_builds run --lane quick --jobs 2 --memory-gb 4 --timeout 900 --
          python -m agent_builds benchmark scale --agents "$BUILDR_SCALE_AGENTS"
          --backlog "$((BUILDR_SCALE_AGENTS * 2))" --history 1000 --hold 4
          --baseline-checkout "$RUNNER_TEMP/buildr-baseline"
          --output "$RUNNER_TEMP/process-scale.json"
      - name: Verify the retained outcome independently
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP'])/'process-scale.json').read_text())
          agents = int(os.environ['BUILDR_SCALE_AGENTS'])
          assert result['result']=='passed'
          for arm in ('baseline','candidate'):
              data = result[arm]
              assert data['actual_runner_processes']==data['idle']['coverage']==agents
              assert data['peak_queued']==agents*3 and data['native_attempts']==agents-2
              assert data['native_outcomes_verified'] and data['lock_conflicts']==0
              assert data['peak_native_commands']<=2 and data['peak_reserved_slots']<=2
              assert data['queued_cancel_exit']==130 and data['killed_runner_state']=='lost'
              assert data['inspection_includes_queue_health']
          PY
      - name: Retain the full comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-scale-${{ matrix.agents }}
          path: ${{ runner.temp }}/process-scale.json
          if-no-files-found: warn
          retention-days: 14
